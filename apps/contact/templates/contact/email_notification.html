<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f4f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e4e4e7; }
        .header { background-color: #18181b; color: #ffffff; padding: 20px; text-align: center; }
        .content { padding: 30px; color: #3f3f46; line-height: 1.6; }
        .field { margin-bottom: 15px; }
        .label { font-weight: bold; color: #18181b; display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .value { background-color: #f4f4f5; padding: 10px; border-radius: 4px; margin-top: 5px; }
        .footer { background-color: #f4f4f5; padding: 15px; text-align: center; font-size: 12px; color: #71717a; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>New Portfolio Inquiry</h2>
        </div>
        <div class="content">
            <p>You have received a new message via your portfolio contact form.</p>

            <div class="field">
                <span class="label">From</span>
                <div class="value">{{ name }} ({{ email }})</div>
            </div>

            <div class="field">
                <span class="label">Subject</span>
                <div class="value">{{ subject }}</div>
            </div>

            <div class="field">
                <span class="label">Message</span>
                <div class="value">
                    {{ message|linebreaksbr }}
                </div>
            </div>
        </div>
        <div class="footer">
            Sent from your automated Portfolio Backend
        </div>
    </div>
</body>
</html>
