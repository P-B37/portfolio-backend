repos:
  # 1. Standard file checks (fix newlines, yaml syntax, etc)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # 2. isort (Import Sorting - configured with black profile)
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # 3. Black (Code Formatting - version aligned with project)
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  # 4. Flake8 (Linting)
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
