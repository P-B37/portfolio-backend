name: Release Version Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate Codebase
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: portfolio_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync --frozen

    - name: Create .env file
      run: |
        cp .env.example .env
        sed -i 's/DB_PASSWORD=postgres/DB_PASSWORD=password/g' .env

    - name: Run Linting
      run: uv run pre-commit run --all-files

    - name: Run Pytest
      env:
        DJANGO_SETTINGS_MODULE: config.settings.local
      run: uv run pytest

  release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required for changelog generation

    - name: Generate Draft GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Create a release draft with automated release notes compiled by GitHub CLI
        gh release create ${{ github.ref_name }} \
          --draft \
          --generate-notes \
          --title "Release ${{ github.ref_name }}"
